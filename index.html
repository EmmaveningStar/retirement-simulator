<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的退休財務模擬器</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#17243b;margin:0;padding:24px}main{max-width:980px;margin:auto}h1{margin-bottom:4px}.muted{color:#627087}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 3px 15px #15243b0c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}label{font-size:14px;font-weight:600;display:block}input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px;font-size:16px}.metric{font-size:26px;font-weight:750;margin-top:6px}.small{font-size:12px;color:#64748b}canvas{width:100%;height:310px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e8edf3;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow-x:auto}.warn{color:#a44915}button{background:#173b73;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}</style></head><body><main><h1>退休財務模擬器 <span style="font-size:14px;color:#65758b">v0.1</span></h1><p class="muted">調整數字，即時觀察退休資產走勢。單位：新臺幣；金額以今日購買力表示。</p><section class="panel"><h2>你的假設</h2><div class="grid"><label>目前年齡<input id="age" type="number" min="18" max="80" value="41" step="0.5"></label><label>退休年齡<input id="retire" type="number" min="20" max="85" value="55.5" step="0.5"></label><label>模擬至幾歲<input id="end" type="number" min="40" max="110" value="85" step="0.5"></label><label>目前投資資產（萬元）<input id="assets" type="number" min="0" value="465"></label><label>退休前每月投資（元）<input id="save" type="number" min="0" value="50000"></label><label>退休後每月從投資提領（元）<input id="spend" type="number" min="0" value="40000"></label><label>退休前實質年報酬率（%）<input id="growth" type="number" min="-30" max="30" value="4" step="0.5"></label><label>退休後實質年報酬率（%）<input id="return" type="number" min="-30" max="30" value="3" step="0.5"></label></div><p class="small">退休後提領額預設為家庭每月生活費 8 萬元的一半；房貸、租金、勞保勞退及其他收入尚未納入。實質報酬率代表已扣除通膨的假設報酬率。</p><button id="reset">恢復預設值</button></section><section class="grid"><div class="panel"><div class="muted">退休當下預估投資資產</div><div id="atRetire" class="metric">—</div></div><div class="panel"><div class="muted">85 歲時預估投資資產</div><div id="atEnd" class="metric">—</div></div><div class="panel"><div class="muted">資產首次耗盡年齡</div><div id="depletion" class="metric">—</div></div></section><section class="panel"><h2>資產變化</h2><canvas id="chart"></canvas><p id="status" class="muted"></p></section><section class="panel"><h2>逐年檢視</h2><div class="scroll"><table><thead><tr><th>年齡</th><th>期末資產</th><th>階段</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="small">模型採每月複利、月末投入或提領；年度報酬率固定，無隨機波動。投資資產下限為 0；無法支付的退休提領視為資產耗盡。此為教學用情境試算，不是投資建議。</p></main><script>const ids=['age','retire','end','assets','save','spend','growth','return'];const defaults=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));const money=x=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(x);function simulate(){const v=Object.fromEntries(ids.map(id=>[id,Number(document.getElementById(id).value)]));if(Object.values(v).some(x=>!Number.isFinite(x))||v.age>=v.retire||v.retire>=v.end){document.getElementById('status').textContent='請確認：目前年齡 < 退休年齡 < 模擬終點年齡。';return}let bal=v.assets*10000,retireBal=null,empty=null,points=[{age:v.age,bal}],total=Math.ceil((v.end-v.age)*12);for(let i=1;i<=total;i++){const ageBefore=v.age+(i-1)/12,retired=ageBefore>=v.retire-1e-9;if(retired&&retireBal===null)retireBal=bal;const annual=(retired?v.return:v.growth)/100;const rate=Math.pow(1+annual,1/12)-1;bal=bal*(1+rate)+(retired?-v.spend:v.save);if(retired&&bal<=0&&empty===null)empty=v.age+i/12;bal=Math.max(0,bal);points.push({age:Math.min(v.end,v.age+i/12),bal})}if(retireBal===null){const nearest=points.reduce((a,b)=>Math.abs(b.age-v.retire)<Math.abs(a.age-v.retire)?b:a);retireBal=nearest.bal}document.getElementById('atRetire').textContent=money(retireBal);document.getElementById('atEnd').textContent=money(bal);document.getElementById('depletion').textContent=empty===null?'模擬期間未耗盡':empty.toFixed(1)+' 歲';document.getElementById('status').textContent='這是固定報酬率的情境，不代表真實市場。退休後每月提領 '+money(v.spend)+'，未計入房貸與退休給付。';const rows=document.getElementById('rows');rows.innerHTML='';for(let a=Math.ceil(v.age);a<=v.end;a++){let p=points.reduce((best,p)=>Math.abs(p.age-a)<Math.abs(best.age-a)?p:best);let tr=document.createElement('tr');[a+' 歲',money(p.bal),a<v.retire?'累積期':'提領期'].forEach(t=>{let td=document.createElement('td');td.textContent=t;tr.appendChild(td)});rows.appendChild(tr)}draw(points,v.retire)}function draw(points,retire){const canvas=document.getElementById('chart'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(300,rect.width)*dpr;canvas.height=310*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=canvas.width/dpr,h=310,pad={l:60,r:14,t:20,b:34},max=Math.max(...points.map(p=>p.bal),1)*1.1,minAge=points[0].age,maxAge=points.at(-1).age,x=a=>pad.l+(a-minAge)/(maxAge-minAge)*(w-pad.l-pad.r),y=b=>h-pad.b-b/max*(h-pad.t-pad.b);c.strokeStyle='#e4e9f1';c.fillStyle='#627087';c.font='12px system-ui';for(let j=0;j<=4;j++){let val=max*j/4,yy=y(val);c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText((val/10000).toFixed(0)+'萬',4,yy+4)}c.strokeStyle='#1e63ad';c.lineWidth=3;c.beginPath();points.forEach((p,i)=>i?c.lineTo(x(p.age),y(p.bal)):c.moveTo(x(p.age),y(p.bal)));c.stroke();c.setLineDash([5,5]);c.strokeStyle='#d58b3a';c.beginPath();c.moveTo(x(retire),pad.t);c.lineTo(x(retire),h-pad.b);c.stroke();c.setLineDash([]);c.fillStyle='#627087';c.fillText(minAge.toFixed(0)+'歲',pad.l,h-8);c.fillText(maxAge.toFixed(0)+'歲',w-pad.r-35,h-8);c.fillText('退休',Math.min(w-50,x(retire)+4),pad.t+12)}ids.forEach(id=>document.getElementById(id).addEventListener('input',simulate));document.getElementById('reset').onclick=()=>{ids.forEach(id=>document.getElementById(id).value=defaults[id]);simulate()};window.addEventListener('resize',simulate);simulate();</script></body></html>
